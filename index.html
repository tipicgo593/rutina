<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rutina">
<meta name="theme-color" content="#EEEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rutina Mancuernas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una pantalla — cabecera, contenido desplazable y barra de pestañas fija abajo. Tinta de hierro fundido sobre papel tiza, acento cobalto. */
:root{
  --bg:#EEEDE8; --surface:#FAF9F6; --surface-2:#E3E2DB; --ink:#1C1F24; --muted:#5E626B; --line:#D3D1C8;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#DCE2F7; --rest:#B4521F; --rest-soft:#F3E1D5; --ok:#2E7D4F; --ok-soft:#D9EEDF;
  --skin:#D9A47E; --hair:#2A1B12; --shoe:#1C1F24; --db:#1C1F24;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171B; --surface:#1E2127; --surface-2:#2A2E36; --ink:#ECEBE6; --muted:#9EA3AD; --line:#323741;
  --accent:#7D97FF; --accent-ink:#0E1220; --accent-soft:#252E4D; --rest:#F0915C; --rest-soft:#3B2A22; --ok:#6CCB92; --ok-soft:#1F3428;
  --skin:#D9A47E; --hair:#0E0A07; --shoe:#0B0C0E; --db:#C9CCD3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1E2127; --surface-2:#2A2E36; --ink:#ECEBE6; --muted:#9EA3AD; --line:#323741;
  --accent:#7D97FF; --accent-ink:#0E1220; --accent-soft:#252E4D; --rest:#F0915C; --rest-soft:#3B2A22; --ok:#6CCB92; --ok-soft:#1F3428;
  --skin:#D9A47E; --hair:#0E0A07; --shoe:#0B0C0E; --db:#C9CCD3; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;line-height:1.05}
p{margin:0}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
main{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 24px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700;font-size:15px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* Tabs */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Hoy */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px 18px 18px;display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:end}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-size:40px;margin-top:4px}
.hero .meta{font-size:14px;opacity:.9;margin-top:6px}
.hero .fig{width:96px;height:96px;background:rgba(255,255,255,.14);border-radius:14px;padding:6px}
.hero .btn{grid-column:1/-1;margin-top:12px;background:var(--accent-ink);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--surface-2)}
.dots i.on{background:var(--ok)}

/* Semana / día */
.daylist{display:flex;flex-direction:column;gap:10px}
.dayrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px}
.dayrow .fig{width:56px;height:56px;background:var(--surface-2);border-radius:10px;padding:4px}
.dayrow h3{font-size:21px}
.dayrow p{font-size:13px;color:var(--muted)}
.dayrow.done{opacity:.72}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;font-size:14px;min-height:40px}
.block h3{font-size:20px}
.block .sub{font-size:13px;color:var(--muted);margin-top:2px}
.exlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.exlist button{width:100%;display:grid;grid-template-columns:48px 1fr 18px;gap:12px;align-items:center;text-align:left;padding:6px 0}
.exlist .fig{width:48px;height:48px;background:var(--surface-2);border-radius:10px;padding:3px}
.exlist .name{font-weight:600;font-size:14.5px;min-width:0}
.exlist .tag{font-size:11.5px;color:var(--muted);font-weight:500;display:block}
.exlist svg.chev{width:16px;height:16px;color:var(--muted)}

/* Hoja de ejercicio */
.sheet-wrap{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto}
.sheet .bigfig{width:170px;height:170px;margin:14px auto;background:var(--surface-2);border-radius:18px;padding:12px}
.sheet h2{font-size:28px}
.sheet ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet .tip{margin-top:14px;padding:12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px}

/* Temporizador */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player.rest{background:var(--rest-soft)}
.player .top{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.player .phase{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-align:center}
.player.rest .phase{color:var(--rest)}
.player .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:0}
.ring{position:relative;width:min(64vw,260px);aspect-ratio:1;max-width:100%}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:clamp(56px,18vw,84px);font-variant-numeric:tabular-nums}
.player .pfig{width:84px;height:84px}
.player h2{font-size:30px;max-width:22ch}
.player .next{font-size:14px;color:var(--muted)}
.player .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.player .bar i{display:block;height:100%;background:var(--accent);width:0}
.player .controls{display:flex;justify-content:center;align-items:center;gap:22px;padding-block:18px 22px}
.round{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.round.big{width:84px;height:84px;background:var(--accent);border:0;color:var(--accent-ink)}
.player.rest .round.big{background:var(--rest);color:#fff}
.round svg{width:24px;height:24px}
.round.big svg{width:34px;height:34px}

/* Historial */
.chart{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:120px;margin-top:12px}
.chart .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .b{width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.chart .b.zero{background:var(--surface-2)}
.chart .l{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .v{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .d{font-family:var(--f-display);font-weight:700;font-size:20px;width:42px;text-align:center;line-height:1}
.log .d small{display:block;font-size:11px;font-family:var(--f-body);color:var(--muted);font-weight:600;text-transform:uppercase}
.log .t{font-weight:600;min-width:0}
.log .m{font-size:13px;color:var(--muted)}

/* Perfil */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font-size:18px;font-weight:600;font-family:var(--f-body);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.imc{display:flex;justify-content:space-between;align-items:baseline}
.imc b{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:50}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px}
.ph{position:relative;display:block;width:100%;height:100%;border-radius:inherit;overflow:hidden;background:#E9E9E7}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
.ph img+img{animation:rep 2.4s ease-in-out infinite}
@keyframes rep{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ph img+img{animation:none;opacity:0}}
.fig.pic,.bigfig.pic{padding:0!important;overflow:hidden}
.player .pfig{width:150px;height:150px;border-radius:16px;overflow:hidden}
.sheet .bigfig.pic{width:min(100%,300px);height:auto;aspect-ratio:1}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .25s linear}.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>


<div class="app">
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M18 12h2M6 8v8M18 8v8M8 10v4M16 10v4M8 12h8"/></svg>Hoy</button>
    <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Semana</button>
    <button data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Progreso</button>
    <button data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
  </nav>
</div>
<div id="overlay"></div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------- ejercicios
const EX = {
  "Press militar con mancuernas":{cat:"upper",pose:"press",db:1,steps:["De pie, pies al ancho de cadera, mancuernas a la altura de los hombros.","Aprieta abdomen y glúteos.","Empuja hacia arriba hasta estirar los brazos sin arquear la espalda.","Baja controlado en 2 segundos."]},
  "Remo con mancuerna a una mano":{cat:"upper",pose:"row",db:1,steps:["Apoya mano y rodilla en una silla o banco, espalda plana.","Brazo libre colgando con la mancuerna.","Tira hacia la cadera llevando el codo atrás.","Aprieta el omóplato un segundo y baja."]},
  "Remo inclinado a dos manos":{cat:"upper",pose:"row2",db:1,steps:["Inclina el torso unos 45° con rodillas suaves.","Mancuernas colgando bajo los hombros.","Tira ambas hacia las costillas.","Baja sin redondear la espalda."]},
  "Flexiones de pecho":{cat:"upper",pose:"pushup",db:0,steps:["Manos algo más abiertas que los hombros.","Cuerpo en línea recta de cabeza a talones.","Baja el pecho casi al piso, codos a 45°.","Empuja de vuelta. Si cuesta, apoya las rodillas."]},
  "Curl de bíceps con mancuernas":{cat:"upper",pose:"curl",db:1,steps:["De pie, codos pegados al torso.","Sube las mancuernas doblando solo el codo.","No balancees el cuerpo.","Baja lento hasta estirar."]},
  "Press de pecho en el piso":{cat:"upper",pose:"floorpress",db:1,steps:["Acostado boca arriba, rodillas dobladas.","Mancuernas sobre el pecho, codos tocando el piso.","Empuja hacia arriba hasta estirar.","Baja hasta que los codos rocen el piso."]},
  "Press Arnold":{cat:"upper",pose:"press",db:1,steps:["Sentado o de pie, mancuernas frente a la cara, palmas hacia ti.","Gira las muñecas mientras empujas arriba.","Termina con palmas al frente y brazos estirados.","Invierte el giro al bajar."]},
  "Elevaciones laterales":{cat:"upper",pose:"raise",db:1,steps:["De pie, mancuernas a los costados.","Codos ligeramente doblados.","Sube los brazos a los lados hasta la altura del hombro.","Baja lento. Usa un peso ligero."]},
  "Extensión de tríceps sobre la cabeza":{cat:"upper",pose:"triceps",db:1,steps:["Sostén una mancuerna con ambas manos sobre la cabeza.","Codos apuntando al frente, cerca de la cabeza.","Baja la mancuerna detrás de la nuca.","Estira los brazos de nuevo."]},
  "Sentadilla goblet":{cat:"lower",pose:"squat",db:1,steps:["Sostén una mancuerna vertical pegada al pecho.","Pies al ancho de hombros, puntas un poco afuera.","Baja la cadera atrás y abajo, rodillas sobre los pies.","Sube empujando con los talones."]},
  "Zancadas alternas":{cat:"lower",pose:"lunge",db:1,steps:["Mancuernas a los costados.","Da un paso largo al frente.","Baja hasta que la rodilla de atrás casi toque el piso.","Empuja con el pie de adelante para volver y cambia de pierna."]},
  "Peso muerto rumano":{cat:"lower",pose:"hinge",db:1,steps:["De pie, mancuernas frente a los muslos.","Rodillas suaves, lleva la cadera hacia atrás.","Baja las mancuernas pegadas a las piernas con la espalda recta.","Sube apretando glúteos."]},
  "Sentadilla sumo":{cat:"lower",pose:"squat",db:1,steps:["Pies bien abiertos, puntas hacia afuera.","Una mancuerna colgando al centro con ambas manos.","Baja con el torso erguido.","Sube empujando las rodillas hacia afuera."]},
  "Zancada búlgara":{cat:"lower",pose:"lunge",db:1,steps:["Empeine de atrás apoyado en una silla.","Pie de adelante a un paso largo.","Baja controlado sobre la pierna de adelante.","Haz todas las repeticiones y cambia de pierna en la siguiente ronda."]},
  "Puente de glúteo con mancuerna":{cat:"lower",pose:"bridge",db:1,steps:["Acostado, rodillas dobladas, pies apoyados.","Mancuerna sobre la cadera, sujeta con las manos.","Sube la cadera hasta alinear rodillas, cadera y hombros.","Aprieta un segundo arriba y baja."]},
  "Subida a silla con mancuernas":{cat:"lower",pose:"stepup",db:1,steps:["Frente a una silla firme o escalón.","Sube un pie completo y empuja con ese talón.","Sube el cuerpo sin impulsarte con la pierna de abajo.","Baja controlado y alterna."]},
  "Plancha":{cat:"core",pose:"plank",db:0,steps:["Antebrazos en el piso, codos bajo los hombros.","Cuerpo recto de cabeza a talones.","Aprieta abdomen y glúteos.","Respira normal, no subas la cadera."]},
  "Plancha con toque de hombro":{cat:"core",pose:"plankhigh",db:0,steps:["Plancha alta con brazos estirados.","Pies separados para más estabilidad.","Toca el hombro contrario con una mano.","Alterna sin mover la cadera."]},
  "Giro ruso con mancuerna":{cat:"core",pose:"twist",db:1,steps:["Sentado, rodillas dobladas, torso inclinado atrás.","Sostén la mancuerna frente al pecho.","Gira el tronco y lleva la mancuerna a un lado.","Gira al otro lado."]},
  "Elevación de piernas":{cat:"core",pose:"legraise",db:0,steps:["Acostado, manos bajo la cadera.","Piernas estiradas.","Súbelas hasta 90°.","Baja lento sin tocar el piso."]},
  "Plancha lateral":{cat:"core",pose:"sideplank",db:0,steps:["De lado, apoyado en un antebrazo.","Pies uno sobre otro.","Sube la cadera hasta formar una línea recta.","Cambia de lado en la siguiente ronda."]},
  "Burpees":{cat:"hiit",pose:"burpee",db:0,steps:["De pie, baja y apoya las manos.","Lleva los pies atrás a plancha.","Regresa los pies a las manos.","Salta arriba con los brazos estirados."]},
  "Sentadilla con salto":{cat:"hiit",pose:"jumpsquat",db:0,steps:["Baja a media sentadilla.","Salta explosivo hacia arriba.","Aterriza suave sobre la punta y el pie completo.","Encadena con la siguiente."]},
  "Escaladores":{cat:"hiit",pose:"climb",db:0,steps:["Plancha alta, manos bajo los hombros.","Lleva una rodilla al pecho.","Cambia rápido de pierna.","Mantén la cadera baja."]},
  "Jumping jacks":{cat:"hiit",pose:"jack",db:0,steps:["De pie, brazos a los lados.","Salta abriendo piernas y subiendo brazos.","Salta cerrando.","Mantén un ritmo constante."]},
  "Saltos de patinador":{cat:"hiit",pose:"skater",db:0,steps:["Salta de lado hacia la derecha.","Aterriza en un pie, el otro cruza atrás.","Salta hacia la izquierda.","Usa los brazos para impulsarte."]},
  "Rodillas arriba":{cat:"hiit",pose:"knees",db:0,steps:["Trota en el sitio.","Sube las rodillas a la altura de la cadera.","Mueve los brazos al ritmo.","Mantén el torso erguido."]},
  "Swing con mancuerna":{cat:"hiit",pose:"swing",db:1,steps:["Pies algo más abiertos que los hombros, una mancuerna con ambas manos.","Lleva la mancuerna entre las piernas doblando la cadera.","Empuja la cadera al frente para impulsarla hasta el pecho.","Los brazos solo guían; la fuerza sale de la cadera."]},
  "Thruster con mancuernas":{cat:"hiit",pose:"press",db:1,steps:["Mancuernas en los hombros.","Baja a sentadilla.","Al subir, empuja las mancuernas arriba en un solo movimiento.","Bájalas a los hombros mientras vuelves a bajar."]},
};

function seg(a,b,c,w){return `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`}
function fig(pose,withDb=true){
  const p=P[pose]||P.plank, skin="var(--skin)", shirt="var(--accent)", shorts="var(--ink)";
  let s=`<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">`;
  s+=`<path d="M4 95H96" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>`;
  if(p.box) s+=`<rect x="${p.box[0]}" y="${p.box[1]}" width="${p.box[2]}" height="${p.box[3]}" rx="3" fill="var(--line)"/>`;
  if(p.jump) s+=`<path d="M30 97Q50 90 70 97" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 4" fill="none"/>`;
  // pierna y brazo del fondo (más oscuros)
  s+=seg(p.hp,p.lk,shorts,10)+seg(p.lk,p.lf,skin,8)+`<ellipse cx="${p.lf[0]}" cy="${p.lf[1]}" rx="5" ry="3.4" fill="var(--shoe)"/>`;
  s+=seg(p.s,p.le,skin,7)+seg(p.le,p.lh,skin,6.5);
  s+=seg(p.s,p.hp,shirt,16)+`<circle cx="${p.hp[0]}" cy="${p.hp[1]}" r="7.5" fill="${shorts}"/>`;
  s+=seg(p.hp,p.rk,shorts,10)+seg(p.rk,p.rf,skin,8)+`<ellipse cx="${p.rf[0]}" cy="${p.rf[1]}" rx="5" ry="3.4" fill="var(--shoe)"/>`;
  s+=seg(p.s,p.re,skin,7.5)+seg(p.re,p.rh,skin,7);
  s+=`<circle cx="${p.h[0]}" cy="${p.h[1]}" r="8.5" fill="${skin}"/><path d="M${p.h[0]-8.5} ${p.h[1]-1}a8.5 8.5 0 0 1 17 0z" fill="var(--hair)"/>`;
  if(withDb && p.dbs) for(const [x,y,r] of p.dbs) s+=`<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-7" y="-1.6" width="14" height="3.2" rx="1.5" fill="var(--db)"/><rect x="-10" y="-4.5" width="4.5" height="9" rx="1.6" fill="var(--db)"/><rect x="5.5" y="-4.5" width="4.5" height="9" rx="1.6" fill="var(--db)"/></g>`;
  return s+`</svg>`;
}

function media(name){const ph=PHOTOS[name];if(!ph)return fig(EX[name].pose,EX[name].db!==0);return `<span class="ph" role="img" aria-label="${esc(name)}${ph.length>1?": posición inicial y final":""}">${ph.map(u=>`<img src="${u}" alt="">`).join("")}</span>`}

 push_pull:{title:"Empuje y tracción",pose:"row",warm:["Círculos de brazos","Flexiones apoyando rodillas"],blocks:[["Circuito de fuerza","strength",["upper","upper","upper"]],["Abdomen","strength",["core","core"]]]},
 posterior:{title:"Glúteo y femoral",pose:"hinge",warm:["Puente sin peso","Bisagra de cadera con palo o toalla"],blocks:[["Circuito de fuerza","strength",["lower","lower","lower"]],["Final HIIT","hiit",["hiit"]]]},
};
const ORDER={
 colesterol:["metabolic","upper_hiit","full","lower_core","posterior","push_pull"],
 grasa:["upper_hiit","metabolic","lower_core","full","posterior","push_pull"],
 fuerza:["upper_hiit","lower_core","push_pull","posterior","full","metabolic"],
 tonificar:["upper_hiit","lower_core","full","metabolic","push_pull","posterior"],
};
const TIMING={
 principiante:{sw:30,sr:30,hw:20,hr:25,tw:20,tr:15},
 intermedio:{sw:40,sr:20,hw:30,hr:15,tw:20,tr:10},
 avanzado:{sw:45,sr:15,hw:30,hr:10,tw:25,tr:10},
};
function rng(seed){let s=(seed%2147483647+2147483647)%2147483647||1;return()=>((s=s*16807%2147483647)-1)/2147483646}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roundsFor(min){return min<=20?{s:2,h:4,t:6,c:180}:min<=25?{s:3,h:5,t:8,c:240}:min<=30?{s:4,h:6,t:8,c:300}:{s:5,h:7,t:8,c:360}}
function blockSecs(b){return b.rounds*b.ex.length*b.work+Math.max(0,b.rounds*b.ex.length-1)*b.rest}
function planSecs(day){return 240+day.blocks.reduce((t,b)=>t+blockSecs(b),0)+(day.blocks.length-1)*60}

function generate(profile,seed){
  const T=TIMING[profile.nivel]||TIMING.intermedio, R=roundsFor(profile.minutos);
  const keys=(ORDER[profile.objetivo]||ORDER.colesterol).slice(0,profile.dias);
  // reparte días de 2 en 2 al repetir arquetipos si dias>6 (no aplica) — orden fijo, ejercicios variables
  return keys.map((k,di)=>{
    const a=ARCH[k], used=new Set(), r=rng(seed*131+di*17+7);
    const blocks=a.blocks.map(([name,kind,slots])=>{
      const ex=[];
      for(const cat of slots){
        const options=shuffle(POOL[cat].filter(e=>!used.has(e)),r);
        const pick=options[0]||POOL[cat][0]; used.add(pick); ex.push(pick);
      }
      let rounds,work,rest;
      if(kind==="strength"){rounds=R.s;work=T.sw;rest=T.sr}
      else if(kind==="tabata"){rounds=R.t;work=T.tw;rest=T.tr}
      else if(kind==="cardio"){rounds=1;work=R.c;rest=0}
      else{rounds=R.h;work=T.hw;rest=T.hr}
      return {name,kind,rounds,work,rest,ex};
    });
    return {id:k,n:di+1,title:a.title,pose:a.pose,warm:a.warm,blocks};
  });
}

// ---------------------------------------------------------------- fechas
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekKey(d){const w=weekStart(d);return `${w.getFullYear()}-${String(w.getMonth()+1).padStart(2,"0")}-${String(w.getDate()).padStart(2,"0")}`}
function weekIndex(d){return Math.round(weekStart(d).getTime()/604800000)}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DIA=["dom","lun","mar","mié","jue","vie","sáb"];
function rangeLabel(d){const a=weekStart(d),b=new Date(a);b.setDate(a.getDate()+6);return `${a.getDate()} ${MES[a.getMonth()]} – ${b.getDate()} ${MES[b.getMonth()]}`}
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

// ---------------------------------------------------------------- estado y guardado
const DEFAULT={profile:{peso:74,altura:175,objetivo:"colesterol",nivel:"intermedio",dias:4,minutos:30},variant:{week:"",offset:0},log:[]};
let S=JSON.parse(JSON.stringify(DEFAULT));
let docRef=null, synced="local";
const LS="rutina-mancuernas-v1";
function lsLoad(){try{const v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function merge(x){if(!x||typeof x!=="object")return;S={profile:{...DEFAULT.profile,...(x.profile||{})},variant:{...DEFAULT.variant,...(x.variant||{})},log:Array.isArray(x.log)?x.log.slice(-400):[]}}
let saveTimer=null;
function save(){
  lsSave();
  if(!docRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{docRef.set(JSON.parse(JSON.stringify(S))).then(()=>{synced="cloud"}).catch(()=>{synced="local"})},400);
}
merge(lsLoad());

async function connect(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    docRef=db.doc(`data/users/${id}/state`);
    const snap=await docRef.get();
    if(snap.exists){
      const remote=snap.data();
      // conserva sesiones registradas en este dispositivo que la nube aún no tenga
      const local=S.log||[];
      merge(remote);
      const seen=new Set(S.log.map(e=>e.at));
      for(const e of local) if(!seen.has(e.at)) S.log.push(e);
      S.log.sort((a,b)=>a.at-b.at);
    }
    synced="cloud"; save(); render();
  }catch(e){ synced="local"; }
}

// ---------------------------------------------------------------- plan actual
function currentPlan(){
  const now=new Date(), wk=weekKey(now);
  const off=S.variant.week===wk?S.variant.offset:0;
  return generate(S.profile,weekIndex(now)*7+off);
}
function doneThisWeek(){const wk=weekKey(new Date());return S.log.filter(e=>e.week===wk)}
function nextDay(plan){const done=new Set(doneThisWeek().map(e=>e.day));return plan.find(d=>!done.has(d.id))||null}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab&&!openDay?"page":"false"));
  const plan=currentPlan();
  if(openDay){const d=plan.find(x=>x.id===openDay);if(d){$view.innerHTML=dayView(d);bindDay(d);return}openDay=null}
  if(tab==="hoy") $view.innerHTML=hoyView(plan);
  if(tab==="semana") $view.innerHTML=semanaView(plan);
  if(tab==="historial") $view.innerHTML=histView();
  if(tab==="perfil") $view.innerHTML=perfilView();
  bind(plan);
  $view.scrollTop=0;
}

function hoyView(plan){
  const now=new Date(), nd=nextDay(plan), done=doneThisWeek();
  const month=S.log.filter(e=>{const d=new Date(e.at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const mins=Math.round(month.reduce((t,e)=>t+(e.secs||0),0)/60);
  let streak=0;{const wi=weekIndex(now);const byWeek={};for(const e of S.log)byWeek[e.week]=(byWeek[e.week]||0)+1;
    for(let i=0;i<104;i++){const d=new Date(now);d.setDate(d.getDate()-7*i);const c=byWeek[weekKey(d)]||0;
      if(c>=S.profile.dias)streak++;else if(i===0)continue;else break;}}
  const greet=now.getHours()<12?"Buenos días":now.getHours()<19?"Buenas tardes":"Buenas noches";
  let hero;
  if(nd){
    hero=`<section class="hero"><div><p class="eyebrow">Hoy · ${DIA[now.getDay()]} ${now.getDate()} ${MES[now.getMonth()]} · Día ${nd.n} de ${plan.length}</p>
      <h1>${esc(nd.title)}</h1><p class="meta">${Math.round(planSecs(nd)/60)} min · ${nd.blocks.length} bloques · ${nd.blocks.reduce((t,b)=>t+b.ex.length,0)} ejercicios</p></div>
      <div class="fig">${fig(nd.pose)}</div>
      <button class="btn btn-block" data-start="${nd.id}">${icon.play.replace('<svg','<svg width="18" height="18"')} Empezar entrenamiento</button></section>
      <button class="btn btn-ghost btn-block" data-open="${nd.id}">Ver ejercicios de hoy</button>`;
  }else{
    hero=`<section class="hero"><div><p class="eyebrow">Semana del ${rangeLabel(now)}</p><h1>Semana completa</h1><p class="meta">Hiciste los ${plan.length} entrenamientos. Descansa o repite uno desde la pestaña Semana.</p></div><div class="fig">${fig("jack",false)}</div></section>`;
  }
  return `<div class="stack">
    <p class="eyebrow">${greet}</p>
    ${hero}
    <div class="card"><div class="row" style="justify-content:space-between"><p style="font-weight:700">Esta semana</p><span class="chip ${done.length>=plan.length?'ok':''}">${done.length} de ${plan.length}</span></div>
      <div class="dots">${plan.map(d=>`<i class="${done.some(e=>e.day===d.id)?'on':''}"></i>`).join("")}</div></div>
    <div class="stats">
      <div class="stat"><b>${streak}</b><span>semanas seguidas cumpliendo</span></div>
      <div class="stat"><b>${mins}</b><span>minutos este mes</span></div>
      <div class="stat"><b>${S.log.length}</b><span>sesiones en total</span></div>
    </div>
    <div class="card"><p class="eyebrow" style="margin-bottom:6px">Cómo elegir el peso</p><p style="font-size:14px">En fuerza, usa una mancuerna con la que al terminar el intervalo sientas que podrías hacer 2 repeticiones más (RIR 2). Si terminas sobrado dos sesiones seguidas, sube de peso.</p></div>
    <p class="sync">Tu progreso se guarda en este iPhone</p>
  </div>`;
}

function histView(){
  const now=new Date(), weeks=[];
  for(let i=7;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-7*i);const k=weekKey(d);const ws=weekStart(d);
    weeks.push({k,label:`${ws.getDate()}/${ws.getMonth()+1}`,min:Math.round(S.log.filter(e=>e.week===k).reduce((t,e)=>t+(e.secs||0),0)/60)})}
  const max=Math.max(60,...weeks.map(w=>w.min));
  const recent=S.log.slice(-20).reverse();
  return `<div class="stack">
    <div><p class="eyebrow">Progreso</p><h1 style="font-size:36px;margin-top:4px">Minutos por semana</h1>
      <p class="note" style="margin-top:4px">Para colesterol y triglicéridos la meta habitual es llegar a 150 min de actividad semanal sumando todo lo que hagas.</p></div>
    <div class="card"><div class="chart" role="img" aria-label="Minutos entrenados en las últimas 8 semanas">${weeks.map(w=>`<div class="col"><span class="v">${w.min||""}</span><div class="b ${w.min?'':'zero'}" style="height:${Math.max(3,w.min/max*82)}%"></div><span class="l">${w.label}</span></div>`).join("")}</div></div>
    <div class="card"><p style="font-weight:700;margin-bottom:4px">Últimas sesiones</p>
      ${recent.length?`<ul class="log">${recent.map((e,i)=>{const d=new Date(e.at);return `<li><span class="d">${d.getDate()}<small>${MES[d.getMonth()]}</small></span><span class="t">${esc(e.title)}<span class="m" style="display:block">${DIA[d.getDay()]} · ${Math.round((e.secs||0)/60)} min</span></span><button class="chip" data-del="${e.at}" aria-label="Borrar sesión">Borrar</button></li>`}).join("")}</ul>`
      :`<p class="note">Aún no hay sesiones. Cuando termines tu primer entrenamiento aparecerá aquí.</p>`}
    </div>
  </div>`;
}

// ---------------------------------------------------------------- eventos
function bind(plan){
  $view.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{openDay=b.dataset.open;render()});
  $view.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startSession(plan.find(d=>d.id===b.dataset.start)));
  const v=document.getElementById("variant");
  if(v) v.onclick=()=>{const wk=weekKey(new Date());S.variant={week:wk,offset:(S.variant.week===wk?S.variant.offset:0)+1};save();render();toast("Nueva variante generada")};
  $view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){S.log=S.log.filter(e=>String(e.at)!==b.dataset.del);save();render();toast("Sesión borrada")}
    else{b.dataset.armed="1";b.textContent="¿Seguro?";b.style.background="var(--rest-soft)";b.style.color="var(--rest)";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Borrar";b.style.cssText=""}},3000)}
  });
  $view.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.set, val=(k==="dias"||k==="minutos")?Number(b.dataset.val):b.dataset.val;
    S.profile[k]=val; save(); render(); tab="perfil"; toast("Rutina actualizada");
  });
  ["peso","altura"].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=()=>{const n=Number(el.value);if(n>0){S.profile[id]=n;save();render()}}});
}
function bindDay(d){
  document.getElementById("back").onclick=()=>{openDay=null;render()};
  $view.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startSession(d));
  $view.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>showEx(b.dataset.ex));
  const m=document.getElementById("markdone"); if(m) m.onclick=()=>{logSession(d,planSecs(d));render();toast("Entrenamiento registrado")};
  $view.scrollTop=0;
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;openDay=null;render()});

}

function logSession(d,secs){S.log.push({at:Date.now(),date:ymd(new Date()),week:weekKey(new Date()),day:d.id,title:d.title,secs:Math.round(secs)});save()}

let toastT;function toast(msg){clearTimeout(toastT);let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;toastT=setTimeout(()=>t.remove(),2200)}

// ---------------------------------------------------------------- sesión con temporizador
let audio=null;
function beep(freq=880,dur=.12,vol=.25){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type="sine";g.gain.value=vol;o.connect(g);g.connect(audio.destination);const t=audio.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function buildSteps(d){
  const st=[{type:"warm",label:"Calentamiento",ex:d.warm.join(" · "),dur:240,block:"Calentamiento",round:"",pose:"jack"}];
  d.blocks.forEach((b,bi)=>{
    if(bi>0) st.push({type:"rest",label:"Cambio de bloque",ex:"Toma agua y prepara las mancuernas",dur:60,block:b.name,round:"",pose:null});
    for(let r=1;r<=b.rounds;r++) b.ex.forEach((e,ei)=>{
      st.push({type:"work",label:"Trabajo",ex:e,dur:b.work,block:b.name,round:`Ronda ${r} de ${b.rounds}`,pose:EX[e].pose,db:EX[e].db});
      const last=r===b.rounds&&ei===b.ex.length-1;
      if(b.rest&&!last) st.push({type:"rest",label:"Descanso",ex:"",dur:b.rest,block:b.name,round:`Ronda ${r} de ${b.rounds}`,pose:null});
    });
  });
  return st;
}

function startSession(d){
  const steps=buildSteps(d), total=steps.reduce((t,s)=>t+s.dur,0);
  let i=0, left=steps[0].dur, running=false, endAt=0, tick=null, lastBeep=-1, wake=null, done=false;
  const C=2*Math.PI*45;
  $ov.innerHTML=`<div class="player" id="pl" role="dialog" aria-modal="true" aria-label="Entrenamiento en curso">
    <div class="top"><button class="back" id="pq">${icon.x} Salir</button><span class="eyebrow" id="pr"></span></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="center">
      <p class="phase" id="pp"></p>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--surface-2)" stroke-width="6"/><circle class="p" id="pc" cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num" id="pn"></div></div>
      <div class="pfig" id="pf"></div>
      <h2 id="pe"></h2>
      <p class="next" id="px"></p>
    </div>
    <div class="controls">
      <button class="round" id="bprev" aria-label="Paso anterior">${icon.prev}</button>
      <button class="round big" id="bplay" aria-label="Iniciar">${icon.play}</button>
      <button class="round" id="bskip" aria-label="Saltar paso">${icon.skip}</button>
    </div></div>`;
  const $=id=>document.getElementById(id);
  async function lock(on){try{if(on&&navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen")}else if(!on&&wake){await wake.release();wake=null}}catch(e){wake=null}}
  function paint(){
    const s=steps[i], isRest=s.type==="rest";
    $("pl").classList.toggle("rest",isRest);
    $("pp").textContent=s.label;
    $("pr").textContent=[s.block,s.round].filter(Boolean).join(" · ");
    $("pn").textContent=mmss(Math.max(0,left));
    $("pc").style.strokeDashoffset=String(C*(1-(s.dur-left)/s.dur));
    $("pc").style.color=isRest?"var(--rest)":"var(--accent)";
    const nxt=steps.slice(i+1).find(x=>x.type==="work");
    if(isRest){$("pe").textContent=nxt&&s.dur<60?"Prepárate":s.ex||"Descanso";$("pf").innerHTML=nxt?media(nxt.ex):"";$("px").textContent=nxt?`Sigue: ${nxt.ex}`:"Último descanso"}
    else{$("pe").textContent=s.ex;$("pf").innerHTML=s.type==="work"?media(s.ex):(s.pose?fig(s.pose,false):"");const n2=steps[i+1];$("px").textContent=n2?(n2.type==="rest"?`Luego: descanso de ${n2.dur} s`:`Luego: ${n2.ex}`):"Último intervalo"}
    const elapsed=steps.slice(0,i).reduce((t,x)=>t+x.dur,0)+(s.dur-left);
    $("pb").style.width=`${Math.min(100,elapsed/total*100)}%`;
    $("bplay").innerHTML=running?icon.pause:icon.play;
    $("bplay").setAttribute("aria-label",running?"Pausar":"Reanudar");
  }
  function go(n){
    if(n>=steps.length){finish();return}
    i=Math.max(0,n); left=steps[i].dur; endAt=Date.now()+left*1000; lastBeep=-1;
    if(running){steps[i].type==="work"?(beep(1046,.25,.3),buzz(200)):(beep(523,.25,.3),buzz([80,60,80]))}
    paint();
  }
  function loop(){
    left=Math.ceil((endAt-Date.now())/1000);
    if(left<=3&&left>0&&lastBeep!==left){lastBeep=left;beep(740,.09,.2)}
    if(left<=0){go(i+1);return}
    paint();
  }
  function play(){
    if(done)return; running=!running;
    if(running){endAt=Date.now()+left*1000;tick=setInterval(loop,200);lock(true);beep(880,.08,.15)}
    else{clearInterval(tick);lock(false)}
    paint();
  }
  function finish(){
    done=true;running=false;clearInterval(tick);lock(false);beep(1318,.4,.3);buzz([120,80,120,80,240]);
    logSession(d,total);
    $("pl").classList.remove("rest");
    $("pl").querySelector(".center").innerHTML=`<p class="phase">Terminado</p><div class="pfig" style="width:120px;height:120px">${fig("jack",false)}</div><h2>${esc(d.title)}</h2><p class="next">${Math.round(total/60)} minutos registrados en tu progreso.</p>`;
    $("pl").querySelector(".controls").innerHTML=`<button class="btn btn-primary" id="pend">Listo</button>`;
    $("pend").onclick=close;
  }
  function close(){clearInterval(tick);lock(false);$ov.innerHTML="";document.removeEventListener("visibilitychange",vis);openDay=null;tab="hoy";render()}
  function vis(){if(document.visibilityState==="visible"&&running){lock(true);loop()}}
  document.addEventListener("visibilitychange",vis);
  $("bplay").onclick=play;
  $("bskip").onclick=()=>go(i+1);
  $("bprev").onclick=()=>go(i-1);
  $("pq").onclick=()=>{
    const b=$("pq");
    if(done||b.dataset.armed){close();return}
    b.dataset.armed="1";b.innerHTML=`${icon.x} ¿Salir sin guardar?`;b.style.color="var(--rest)";
    setTimeout(()=>{if(b.isConnected&&!done){delete b.dataset.armed;b.innerHTML=`${icon.x} Salir`;b.style.color=""}},3000);
  };
  paint();
}

render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
